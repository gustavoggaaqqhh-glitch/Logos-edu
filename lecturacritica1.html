                            <button onclick="startExam()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-5 rounded-xl shadow-lg transition-transform active:scale-95 text-xl">
                                COMENZAR EXAMEN
                            </button>
                        </div>
                    </div>
                </div>`;
        } else if (currentStep === 'test') {
            const q = questions[qIndex];
            app.innerHTML = `
                <header class="bg-white border-b px-6 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm no-print">
                    <div class="flex items-center gap-4">
                        <div class="bg-slate-100 px-3 py-1 rounded-lg border">
                            <span class="text-[10px] font-black text-slate-400 block uppercase text-center">Pregunta</span>
                            <span class="text-xl font-bold text-blue-600">${q.num} / ${questions.length}</span>
                        </div>
                        <div class="hidden sm:block">
                            <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest">IE GABRIEL GARCÍA MÁRQUEZ</div>
                            <div class="text-xs font-bold text-slate-600 truncate max-w-[180px] uppercase">${studentName}</div>
                        </div>
                    </div>
                    <div id="timerDisplay" class="text-2xl font-mono font-black text-red-600 bg-red-50 px-6 py-2 rounded-xl border-2 border-red-100">
                        ${formatTime(timeLeft)}
                    </div>
                </header>
                <main class="flex-1 p-6 sm:p-10 no-print">
                    <div class="max-w-4xl mx-auto">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-8 space-y-6">
                            ${q.image ? `
                                <div class="mb-6 flex flex-col items-center">
                                    <img src="${q.image}" alt="Petricor: el olor de la lluvia" class="rounded-2xl max-w-full md:max-w-md shadow-md border" onerror="this.onerror=null; this.parentElement.innerHTML = \`${petricorFallbackSvg.replace(/`/g, '\\`')}\`;" />
                                </div>
                            ` : ''}
                            <div class="p-6 bg-slate-50 rounded-2xl border-l-8 border-blue-500 text-slate-700 italic text-base leading-relaxed whitespace-pre-wrap text-content">${q.text}</div>
                            <h2 class="text-xl md:text-2xl font-bold text-slate-800 leading-snug">${q.question}</h2>
                            <div class="grid gap-3 mt-8">
                                ${q.options.map(opt => `
                                    <button onclick="pickOption('${opt.id}')" 
                                        class="option-card text-left p-5 border-2 rounded-2xl flex items-start transition-all ${studentChoices[qIndex] === opt.id ? 'option-selected' : 'border-slate-100'}">
                                        <span class="w-8 h-8 rounded-full border-2 flex items-center justify-center font-bold mr-5 shrink-0 ${studentChoices[qIndex] === opt.id ? 'bg-blue-600 text-white border-blue-600' : 'border-slate-300'}">${opt.id}</span>
                                        <span class="text-lg text-slate-700 leading-tight">${opt.text}</span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </main>
                <footer class="bg-white border-t p-6 flex justify-between items-center sticky bottom-0 shadow-lg no-print">
                    <button onclick="move(-1)" ${qIndex === 0 ? 'disabled' : ''} class="px-8 py-3 bg-slate-100 rounded-xl font-bold text-slate-400 disabled:opacity-30">Anterior</button>
                    ${qIndex === questions.length - 1 ? 
                        `<button onclick="finishExam()" class="px-10 py-3 bg-green-600 text-white font-bold rounded-xl shadow-md hover:bg-green-700">FINALIZAR</button>` : 
                        `<button onclick="move(1)" class="px-10 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-md hover:bg-blue-700">Siguiente</button>`
                    }
                </footer>`;
        } else if (currentStep === 'results') {
            app.innerHTML = `
                <div class="p-6 md:p-10 no-print flex-1 flex flex-col items-center">
                    <div class="bg-white max-w-4xl w-full rounded-[40px] shadow-2xl p-10 border-b-[12px] border-blue-600 text-center results-container">
                        <h2 class="text-gray-400 font-black tracking-widest text-xs uppercase mb-2">IE Gabriel García Márquez</h2>
                        <h1 class="text-3xl font-extrabold text-slate-800 mb-4 uppercase">${studentName}</h1>
                        <div class="text-blue-600 font-bold mb-8 italic uppercase text-sm tracking-widest border-b pb-4">Cuadro de Respuestas Registradas - Lectura Crítica</div>
                        
                        <div class="flex justify-center mb-10 overflow-hidden">
                            <table class="border-2 border-black w-full max-w-2xl text-center">
                                <thead class="bg-gray-100">
                                    <tr>
                                        <th class="w-[15%]"># Preg.</th>
                                        <th class="w-[35%]">Tu Resp.</th>
                                        <th class="w-[15%]"># Preg.</th>
                                        <th class="w-[35%]">Tu Resp.</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white">
                                    ${Array.from({ length: 10 }).map((_, i) => {
                                        const idx1 = i;
                                        const idx2 = i + 10;
                                        return `
                                        <tr>
                                            <td class="font-bold border-r border-black h-12">${questions[idx1].num}</td>
                                            <td class="font-black text-blue-700 text-xl border-r border-black">${studentChoices[idx1] || '-'}</td>
                                            <td class="font-bold border-r border-black h-12">${questions[idx2].num}</td>
                                            <td class="font-black text-blue-700 text-xl">${studentChoices[idx2] || '-'}</td>
                                        </tr>`;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>

                        <button onclick="window.print()" class="w-full bg-slate-900 text-white px-10 py-5 rounded-2xl font-bold flex items-center justify-center gap-4 hover:bg-black transition-all shadow-xl">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2-2v4h10z"></path></svg>
                            IMPRIMIR REGISTRO EN UNA HOJA
                        </button>
                    </div>
                </div>

                <div class="print-only p-12 bg-white min-h-screen text-black">
                    <div class="text-center border-b-4 border-black pb-4 mb-8">
                        <h1 class="text-2xl font-black uppercase tracking-tighter text-center">IE GABRIEL GARCÍA MÁRQUEZ</h1>
                        <h2 class="text-lg font-bold text-center">HOJA DE RESPUESTAS - SIMULACRO LECTURA CRÍTICA</h2>
                    </div>

                    <div class="flex justify-between items-end mb-8">
                        <div class="text-xl font-bold uppercase">ESTUDIANTE: <span class="underline">${studentName}</span></div>
                        <div class="text-sm font-bold border-b border-black w-40 text-center">Fecha: ${new Date().toLocaleDateString()}</div>
                    </div>

                    <div class="flex justify-center mb-12">
                        <table class="w-full border-2 border-black">
                            <thead class="bg-gray-100">
                                <tr>
                                    <th class="w-[15%]">#</th>
                                    <th class="w-[35%]">Opción Elegida</th>
                                    <th class="w-[15%]">#</th>
                                    <th class="w-[35%]">Opción Elegida</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${Array.from({ length: 10 }).map((_, i) => {
                                    const idx1 = i;
                                    const idx2 = i + 10;
                                    return `
                                    <tr>
                                        <td class="font-bold text-sm h-8 border-r border-black">${questions[idx1].num}</td>
                                        <td class="font-black text-xl border-r border-black">${studentChoices[idx1] || '-'}</td>
                                        <td class="font-bold text-sm h-8 border-r border-black">${questions[idx2].num}</td>
                                        <td class="font-black text-xl">${studentChoices[idx2] || '-'}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-20 flex justify-around text-center">
                        <div class="w-64 border-t-2 border-black pt-2 text-xs font-black uppercase">Firma del Estudiante</div>
                        <div class="w-64 border-t-2 border-black pt-2 text-xs font-black uppercase">Sello Institucional / Firma</div>
                    </div>
                </div>
            `;
        }
    }

    function formatTime(s) {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                petricorImage = e.target.result;
                // Actualizar la imagen en las preguntas 18, 19 y 20
                questions[17].image = petricorImage;
                questions[18].image = petricorImage;
                questions[19].image = petricorImage;
            };
            reader.readAsDataURL(file);
        }
    }

    function startExam() {
        const nameInput = document.getElementById('nameInput');
        if (!nameInput || !nameInput.value.trim()) {
            alert("Por favor, ingresa tu nombre completo.");
            return;
        }
        studentName = nameInput.value.trim();
        currentStep = 'test';
        timerInterval = setInterval(() => {
            timeLeft--;
            const display = document.getElementById('timerDisplay');
            if (display) display.innerText = formatTime(timeLeft);
            if (timeLeft <= 0) finishExam();
        }, 1000);
        render();
    }

    function pickOption(id) {
        studentChoices[qIndex] = id;
        render();
    }

    function move(dir) {
        const newIdx = qIndex + dir;
        if (newIdx >= 0 && newIdx < questions.length) {
            qIndex = newIdx;
            render();
            window.scrollTo(0, 0);
        }
    }

    function finishExam() {
        clearInterval(timerInterval);
        currentStep = 'results';
        render();
        window.scrollTo(0, 0);
    }

    window.onload = render;
</script>
</body>
</html>
