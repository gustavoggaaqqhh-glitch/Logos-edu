        {
            id: 1,
            title: "1. Selva Amazónica y Comunidades Aisladas",
            context: `Representantes de los gremios minero y petrolero han enviado un comunicado al Gobierno con la intención de obtener los permisos necesarios para intervenir la selva amazónica. Estos gremios argumentan que esta intervención les permitiría mejorar la competitividad de este sector del mercado y generar empleos para las comunidades de la región del Amazonas. Por otra parte, los líderes de algunos pueblos indígenas del Amazonas llevan varios meses pidiendo la ayuda del Gobierno para proteger los territorios de sus “hermanos aislados”, pueblos indígenas que han decidido voluntariamente aislarse en las selvas huyendo de la esclavitud, la violencia y las enfermedades que la civilización occidental ha traído consigo durante los últimos cinco siglos. La amenaza para estos pueblos aún sigue latente; por ejemplo, en el último año varias comunidades indígenas se han visto seriamente afectadas por la cuestión de contornos de gripa y sarampión, producto de encuentros imprevistos con leñadores de grupos madereros ilegales en el Amazonas.\n\nPara tomar una decisión informada sobre este tema, el Gobierno ha pedido la colaboración, tanto de su Ministerio de Minas y Energía, como de los académicos estudiosos de la cultura y la cosmovisión de estos pueblos indígenas del Amazonas. Los académicos argumentan que, teniendo en cuenta la gran vulnerabilidad que estos pueblos antiguos presentan frente a las enfermedades más comunes de Occidente, es necesario crear estructuras legales que protejan los territorios en donde podrían habitar los pueblos indígenas en aislamiento voluntario, respetando su autodeterminación a no ser contactados y protegiendo el gran patrimonio cultural, espiritual y natural que ellos poseen. Por otra parte, desde el Ministerio de Minas y Energía se argumenta que la solución está en que se reúnan los gremios minero, petrolero y maderero con las comunidades indígenas del Amazonas, incluyendo a las comunidades indígenas en aislamiento voluntario, para así poder negociar qué partes de la selva amazónica pueden ser explotadas legalmente para beneficio del desarrollo económico del país.`,
            text: "En relación con la propuesta planteada por el Ministerio de Minas y Energía, ¿cuál de las siguientes opciones describe una posible reacción o respuesta que NO se tuvo en cuenta en dicha propuesta?",

        {
            id: 2,
            title: "2. Mercados Campesinos y Tratados Comerciales",
            context: `Un grupo de campesinos productores de papa se ha visto afectado por la entrada en vigencia de un tratado de libre comercio que ha permitido el ingreso al país de alimentos extranjeros que son más económicos, incluyendo la papa. La situación se ha complicado tanto para ellos, que sus ingresos se han reducido considerablemente y se ha puesto en riesgo su permanencia como agricultores. Esto afecta aspectos esenciales de su vida, dado que muchas de sus tradiciones y elementos culturales están relacionados con el cultivo de la tierra. Los campesinos mencionan que los políticos prometieron, en sus campañas, que los tratados no los afectarían, pues sus cultivos y productos serían protegidos.\n\nAnte esta situación, deciden rescatar una antigua tradición: los mercados campesinos, donde pueden vender sus productos sin intermediarios y a precios más bajos. Con esto se busca mejorar la calidad de vida de los productores, que más personas accedan a alimentos de alta calidad y que sus productos compitan en mejores condiciones frente a los productos extranjeros. Ahora bien, se busca ampliar este tipo de mercados a todo el país, pues la medida ha sido altamente beneficiosa para los cultivadores de papa, para los consumidores y para la tradición, pues se rescatan prácticas olvidadas.`,

            id: 3,
            title: "3. Presupuesto y Acueducto",
            context: `Para llevar agua a varios municipios, el gobernador de un departamento propone la extensión del sistema de acueducto con presupuesto del Gobierno nacional. Después de varios estudios, un equipo de ingenieros entrega el diseño del proyecto. Este diseño contempla el trazado que tendrá el acueducto, el presupuesto general que se requiere para construirlo, el plan para proteger la flora y la fauna de la región, y la reubicación temporal de algunas familias que viven donde se llevarán a cabo las obras. Ahora bien, cuando el gobernador pretende dar inicio al proyecto, el Gobierno nacional le comunica que, si se considera el diseño entregado por los ingenieros, no habrá dinero suficiente para ejecutar la obra.`,

        {
            id: 5,
            title: "5. Discurso Político y Cambio Climático",
            context: `En Estados Unidos existe un debate sobre el cambio climático, definido como variaciones del clima atribuidas directa o indirectamente a la actividad humana, que alteran la composición de la atmósfera mundial y que se suman a la variabilidad natural del clima observada durante períodos de tiempo comparables. Este debate ha llevado a que algunos Gobiernos se resistan a suscribir acuerdos internacionales que comprometan a los Estados a reducir la emisión de gases. El ejemplo más reciente fue el retiro de los Estados Unidos del Acuerdo de París. Esta situación ha generado que grupos ambientalistas protesten e insistan en que el desarrollo económico no puede seguir poniendo en peligro la existencia misma del planeta.\n\nAl respecto, el presidente de un país, escéptico del cambio climático, escribió en su red social de internet las siguientes dos frases:\n1. "Por el cambio climático que deberíamos estar preocupados es el provocado por las armas nucleares que están en las manos de líderes locos o incompetentes".\n2. "Hace frío afuera. ¿Dónde demonios está el cambio climático?".\n\nTomado y adaptado de: http://www.minambiente.gov.co/index.php/cambio-climatico y de http://www.elfinanciero.com.mx/`,

                { id: 'D', text: "Sí, porque, al ser difundido en una red social con tantos seguidores, lo expresado tiene un impacto a nivel de la economía internacional." }
            ],

        },
        {
            id: 6,
            title: "6. Teoría de la Dependencia",
            context: `La teoría de la dependencia argumenta que la pobreza que existe en los países del sur se debe a condiciones históricas que han estructurado el mercado global de tal manera que favorece a los países del norte y mantiene a los países del sur en un estado constante de pobreza. Es así como, desde sus inicios, los países del sur han servido como proveedores de materia prima para los países del norte y, a cambio, han sido receptores de aquellos productos terminados que ya han cumplido su ciclo en los mercados del norte. De esta manera, se crea un vínculo de dependencia, en el que las economías del sur dependen de la voluntad de compra de materias primas por parte de los países del norte.\n\nTomado y adaptado de: Subgerencia Cultural del Banco de la República. (2015). Teoría de la dependencia. http://www.banrepcultural.org/blaavirtual/ayudadetareas/politica/teoria_de_la_dependencia`,
            text: "¿Cuál de las siguientes situaciones se ajusta al modelo teórico descrito?",
            options: [
                { id: 'A', text: "Un país latinoamericano desarrolla tecnología industrial que le permite procesar materias primas para generar productos con valor añadido, que se venden dentro del mismo país." },

                { id: 'C', text: "Un país desarrollado de Europa genera riquezas gracias a sus adelantos tecnológicos y, luego, impulsa el avance de la industria de países en desarrollo, porque comparte con ellos esta nueva tecnología." },

            correct: 'B'
        },
        {
            id: 7,
            title: "7. Desarrollo Sostenible",
            context: `La Organización de las Naciones Unidas (ONU) define el “desarrollo sostenible” como\n“[…] la satisfacción de ‘las necesidades de la generación presente sin comprometer la capacidad de las generaciones futuras para satisfacer sus propias necesidades’. El desarrollo sostenible ha emergido como el principio rector para el desarrollo mundial a largo plazo. Consta de tres pilares: el desarrollo sostenible trata de lograr, de manera equilibrada, el desarrollo económico, el desarrollo social y la protección del medio ambiente. [A partir de lo anterior] la Conferencia de las Naciones Unidas sobre el Desarrollo Sostenible, o Cumbre de la Tierra de Río 20, se centrará en dos temas: 1) la economía verde en el contexto del desarrollo sostenible y la erradicación de la pobreza y 2) el marco institucional para el desarrollo sostenible”.\n\nTomado y adaptado de: Asamblea General de las Naciones Unidas (s. f.). Desarrollo Sostenible. http://www.un.org/es/ga/president/65/issues/sustdev.shtml`,
            text: "De acuerdo con la anterior definición, una política económica es sostenible cuando",
            options: [
                { id: 'A', text: "privilegia la industrialización para generar empleo por encima de la necesidad de disminuir los gases de efecto invernadero." },
                { id: 'B', text: "le da la misma importancia a la generación de riqueza y a la explotación ilimitada de los recursos naturales." },
                { id: 'C', text: "le da la misma importancia a la generación de riqueza para las personas y a la protección del medio ambiente." },
                { id: 'D', text: "prohíbe totalmente aprovechar económicamente los bienes y servicios ecosistémicos de lagos, ríos y bosques para lograr su conservación." }

        {
            id: 8,
            title: "8. División del Trabajo (Adam Smith)",
            context: `Para Adam Smith, economista y filósofo escocés del siglo XVIII, la división del trabajo aumenta la productividad, pues cada persona se enfoca en producir aquello en lo que es mejor y, luego, lo intercambia de forma mercantil por los otros bienes y servicios que necesita. Si cada uno dependiera del automovimiento, tendría menos posibilidades de fabricar la misma cantidad de bienes que le es posible conseguir en el intercambio.`,
            text: "Según el concepto de división del trabajo, para Smith, el mercado",
            options: [

                { id: 'C', text: "hace que las personas se vuelvan más ignorantes, pues no saben cómo producir ciertos bienes." },

        {
            id: 9,
            title: "9. Especies Invasoras y Ecosistemas Marinos",
            context: `El Gobierno está investigando el impacto que tiene el pez león en los ecosistemas marítimos colombianos y las formas de combatirlo. El pez león, especie originaria de Asia, se ha convertido en una amenaza o “plaga” para los ecosistemas marítimos y se ha extendido a las costas del Caribe colombiano. Según un artículo de prensa, este pez genera dos tipos de peligro: “Por un lado, es una amenaza para el hombre, que puede sufrir accidentes al pisar o tocar sus nocivas púas venenosas, y, por otro, es una amenaza para las especies nativas, pues se alimenta de peces jóvenes que sirven de alimentación para el hombre, como el pargo y el mero”.\n\nTomado y adaptado de: Agencia de Noticias de la Universidad Nacional. (15 de diciembre de 2009). Pez león ataca en el Caribe colombiano. Revista Semana. https://www.semana.com/-vida-moderna/ciencia/articulo/pez-leon-ataca-caribe-colombiano/111041-3/`,
            text: "¿Para cuál de los siguientes objetivos de investigación del Gobierno sería útil la anterior información?",

                { id: 'D', text: "Establecer la cantidad de especies nativas existentes antes de la aparición del pez león." }

            correct: 'C'
        },
        {
            id: 10,
            title: "10. Mecanismos de Participación: Referendo",
            context: `En Colombia, una importante firma encuestadora reveló que, desde hace cuatro años, la corrupción es percibida por la ciudadanía como uno de los problemas más graves que afecta al país. En la versión más reciente de la encuesta aplicada, se muestra que el 84 % de los encuestados piensa que el problema está empeorando. Al respecto, un grupo de jóvenes decide promover el aumento de las penas para los delitos de corrupción y fortalecer a las entidades de control como la Procuraduría General de la Nación y la Contraloría General de la República. Sin embargo, al buscar apoyo para promover su ley, los jóvenes se dan cuenta de que en todos los partidos políticos hay escándalos de corrupción, por lo que reciben poco apoyo para su iniciativa. Ante esta situación, los jóvenes deciden promover un referendo aprobatorio de iniciativa ciudadana.\n\nTomado y adaptado de: Ávila, R. (4 de octubre de 2020). La corrupción en Colombia: un mal más grave que el coronavirus. Portafolio. https://www.portafolio.co/economia/la-corrupcion-en-colombia-un-mal-mas-grave-que-el-coronavirus-545299`,
            text: "En esta situación, y teniendo en cuenta la Constitución Política de Colombia, ¿pueden los jóvenes continuar con su propuesta de referendo?",

        },
        {
            id: 11,
            title: "11. Activismo Climático y Evidencia Científica",
            context: `En 2019, una joven de 16 años pronunció el siguiente discurso ante el Parlamento Británico sobre el desarrollo sostenible y la urgencia de actuar decididamente para frenar el cambio climático:\n“La crisis climática es, a la vez, el conflicto más fácil y el más difícil al que nos hemos enfrentado. El más fácil porque sabemos lo que tenemos que hacer y el más difícil porque nuestra economía depende de la destrucción de los ecosistemas [...] Alrededor del 2030, habremos desatado una reacción en cadena irreversible [...] que, seguramente, pondrá fin a nuestra civilización tal como la conocemos. Eso es lo que sucederá, a menos que se tomen medidas sin precedentes.\nY tengan en cuenta que estos cálculos dependen de inventos que todavía no se han hecho a esa escala, inventos que se supone que limpiarán la atmósfera de cantidades astronómicas de dióxido de carbono [...] Pero quizá la idea más equivocada sobre la crisis climática es que tenemos que ‘reducir’ las emisiones [...] Sin embargo, eso es solo el comienzo de un proceso rápido que debe llevar al fin de las emisiones en un par de décadas o menos. Y cuando digo ‘fin’ quiero decir cero y, luego, pasar rápidamente a cifras negativas. Eso descarta automáticamente la mayoría de las políticas actuales”.\n\nTomado y adaptado de: Thunberg, G. (2019). El discurso completo de Greta Thunberg ante el Parlamento británico: “Volveremos a clase cuando escuchéis a la ciencia”. El País. https://www.eldiario.es/internacional/greta-thunberg-parlamento-britanico-volveremos_1_1581512.html`,
            text: "¿Cuál de los siguientes hechos permite sustentar el reclamo de la joven por políticas concretas contra el cambio climático?",

                { id: 'A', text: "Durante 2022, la venta de carros eléctricos en América Latina aumentó un 21,7 % frente al año anterior, aunque la mayoría de estos son importados, pues las empresas que se encargan de ensamblar vehículos en la región todavía no los producen." },
                { id: 'B', text: "Si bien las tasas de pobreza en el mundo se han reducido a más de la mitad desde el 2000, la pandemia de la COVID-19 podría aumentar la pobreza a nivel mundial hasta llegar a afectar a 500 millones de personas más o a un 8 % más de la población mundial." },
                { id: 'C', text: "Desde 1990, Reino Unido ha reducido en un 37 % la explosión de dióxido de carbono al ambiente, gracias al cierre de sus viejas plantas de carbón, aunque todavía no ha conseguido eliminar completamente la generación de estos gases contaminantes." },
                { id: 'D', text: "El crecimiento continuo y sostenido de la capacidad instalada de producción de energía eólica a nivel mundial en los últimos 10 años ha tenido un repunte reciente, gracias al desarrollo de máquinas cada vez más potentes y adaptadas a distintos entornos." }
            ],
            correct: 'C'
        },
        {
            id: 12,
            title: "12. Indigenismo y Constitución de 1991",
            context: `Una ley en Colombia establecía lo siguiente:\n“Artículo 1.º- Para atender a la reducción y civilización de las tribus indígenas en el territorio colombiano, se divide este en seis corregimientos [...]”.`,
            text: "¿Cuál de los siguientes argumentos permite afirmar que esta ley es anterior a la Constitución política de 1991?",

            text: "¿La afirmación de los investigadores contiene algún prejuicio?",
            options: [

        {
            id: 14,
