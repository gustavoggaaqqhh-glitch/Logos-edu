    let currentQIdx = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let timeLeft = 3600;
    let timerId = null;
    let studentName = "";
    let currentUser = null;

    async function checkStudentSession() {
        try {
            const { data: { session } } = await sbClient.auth.getSession();
            if (session && session.user) {
                currentUser = session.user;
                const meta = currentUser.user_metadata || {};
                studentName = meta.full_name || meta.documento || currentUser.email.split('@')[0];

                const { data: intento } = await sbClient
                    .from('intentos')
                    .select('id, finalizado')
                    .eq('simulacro_id', SIMULACRO_ID)
                    .eq('user_id', currentUser.id)
                    .maybeSingle();

                if (intento && intento.finalizado) {
                    alert("Ya has presentado este simulacro previamente. Tu intento se encuentra cerrado.");
                    window.location.href = "../modulos.html";
                    return;
                }
            } else {
                studentName = "Estudiante";
            }
        } catch (e) {
            console.log("Modo de prueba local sin sesión");
        }
    }

    function render() {
        const app = document.getElementById('app');
        
        if (currentStep === 'intro') {
            app.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-6">
                    <div class="bg-white max-w-xl w-full rounded-3xl shadow-2xl p-8 md:p-10 border border-slate-100 border-t-[10px] border-t-blue-600">
                        <div class="text-center mb-6">
                            <img src="logo.png" onerror="this.onerror=null; this.src='../logo.png';" alt="Logos Edu" class="h-20 w-auto mx-auto mb-3 object-contain block">
                            <span class="text-xs uppercase font-extrabold text-blue-600 tracking-widest bg-blue-50 px-3 py-1 rounded-full border border-blue-100">Simulacro 2 • Saber 11</span>
                            <h1 class="text-2xl md:text-3xl font-black text-slate-900 mt-3">Ciencias Sociales y Ciudadanas</h1>
                            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-1">Logos Edu • Formación Rural y Equidad</h2>
                        </div>
                        <div class="space-y-6">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Nombre del Estudiante</label>
                                <input type="text" id="nameInput" value="${studentName}" placeholder="Ingresa tu nombre completo" class="w-full p-4 border-2 border-slate-200 rounded-xl outline-none focus:border-blue-600 font-medium text-slate-800">
                            </div>
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center space-y-1">
                                <p class="text-xs font-bold text-slate-500 uppercase">Condiciones del examen</p>
                                <p class="text-sm font-extrabold text-blue-900">20 Preguntas • 60 Minutos • Intento Único</p>
                            </div>
                            <button onclick="startExam()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/20 transition-all text-base tracking-wide cursor-pointer">
                                INICIAR SIMULACRO
                            </button>
                            <div class="text-center">
                                <a href="../modulos.html" class="text-xs text-slate-400 hover:text-slate-600 font-semibold underline">Volver a la Ruta de Módulos</a>
                            </div>
                        </div>
                    </div>
                </div>`;
        } else if (currentStep === 'testing') {
            const q = questions[currentQIdx];
            app.innerHTML = `
                <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
                    <div class="flex items-center gap-3">
                        <img src="logo.png" onerror="this.onerror=null; this.src='../logo.png';" alt="Logos Edu" class="h-9 w-auto object-contain">
                        <span class="font-black text-blue-600 text-sm">Simulacro 2</span>
                        <span class="text-slate-300">|</span>
                        <div class="font-bold text-slate-700 text-sm">Pregunta ${currentQIdx + 1} de ${questions.length}</div>
                    </div>
                    <div id="timerDisplay" class="text-lg font-mono font-black text-rose-600 bg-rose-50 px-4 py-1.5 rounded-xl border border-rose-200">
                        ${formatTime(timeLeft)}
                    </div>
                </header>
                <main class="flex-1 p-6 md:p-10 max-w-4xl mx-auto w-full">
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-6 md:p-8 space-y-6">
                            <div class="bg-slate-50 p-6 rounded-2xl border-l-4 border-blue-600 text-slate-700 text-sm md:text-base context-area whitespace-pre-wrap">${q.context}</div>
                            <h2 class="text-lg md:text-xl font-bold text-slate-900 leading-snug">${q.text}</h2>
                            <div class="grid gap-3 mt-6">
                                ${q.options.map(opt => `
                                    <button onclick="selectOption('${opt.id}')" 
                                        class="text-left p-4 rounded-2xl border-2 flex items-start transition-all cursor-pointer ${userAnswers[currentQIdx] === opt.id ? 'option-selected' : 'border-slate-200 hover:border-blue-300 bg-white'}">
                                        <span class="w-8 h-8 rounded-xl border-2 flex items-center justify-center font-bold mr-4 shrink-0 transition-colors ${userAnswers[currentQIdx] === opt.id ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'border-slate-300 text-slate-700'}">${opt.id}</span>
                                        <span class="text-sm md:text-base text-slate-800 leading-relaxed pt-0.5">${opt.text}</span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </main>
                <footer class="bg-white border-t border-slate-200 p-4 md:px-10 flex justify-between items-center sticky bottom-0 z-40">
                    <button onclick="prevQ()" ${currentQIdx === 0 ? 'disabled' : ''} class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold text-sm disabled:opacity-30 disabled:pointer-events-none transition cursor-pointer">
                        ← Anterior
                    </button>
                    ${currentQIdx === questions.length - 1 ? 
                        `<button onclick="finishExam()" class="px-8 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md text-sm transition cursor-pointer">FINALIZAR Y REGISTRAR</button>` : 
                        `<button onclick="nextQ()" class="px-8 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md text-sm transition cursor-pointer">Siguiente →</button>`
                    }
                </footer>`;
        } else if (currentStep === 'results') {
            app.innerHTML = `
                <div class="flex-1 flex items-center justify-center p-6">
                    <div class="bg-white max-w-lg w-full rounded-3xl shadow-2xl p-8 md:p-10 border border-slate-200 text-center space-y-6">
                        
                        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-inner">
                            ✓
                        </div>

                        <div>
                            <span class="text-xs uppercase font-extrabold text-emerald-600 tracking-wider bg-emerald-50 px-3 py-1 rounded-full border border-emerald-200">
                                Intento Cerrado y Registrado
                            </span>
                            <h1 class="text-2xl font-black text-slate-900 mt-3">¡Prueba Finalizada con Éxito!</h1>
                            <p class="text-sm font-semibold text-slate-700 mt-1 uppercase">${studentName}</p>
                        </div>

                        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 text-left text-xs text-slate-600 space-y-2 leading-relaxed">
                            <p class="font-bold text-slate-800 flex items-center gap-2">
                                <span>🔒</span> Respuestas guardadas en el servidor
                            </p>
                            <p>Tus respuestas han sido procesadas correctamente. Siguiendo el protocolo oficial de evaluación formativa, tu único intento ha sido bloqueado.</p>
                            <p class="text-blue-700 font-medium">
                                🗓️ El informe pedagógico personalizado generado por el docente tutor estará disponible en la fecha de cierre programada.
                            </p>
                        </div>

                        <a href="../modulos.html" class="w-full inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/20 transition-all text-sm cursor-pointer">
                            Volver a la Ruta de Entrenamiento
                        </a>

                    </div>
                </div>`;
        }
    }

    function formatTime(s) {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function startExam() {
        const nameInput = document.getElementById('nameInput');
        const val = nameInput ? nameInput.value.trim() : studentName;
        if (!val) return alert("Por favor, ingresa tu nombre completo.");
        studentName = val;
        currentStep = 'testing';
        timerId = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) finishExam();
            const display = document.getElementById('timerDisplay');
            if (display) display.innerText = formatTime(timeLeft);
        }, 1000);
        render();
    }

    function selectOption(id) { userAnswers[currentQIdx] = id; render(); }
    function nextQ() { if (currentQIdx < questions.length - 1) { currentQIdx++; render(); window.scrollTo(0,0); } }
    function prevQ() { if (currentQIdx > 0) { currentQIdx--; render(); window.scrollTo(0,0); } }

    async function finishExam() {
        clearInterval(timerId);

        let correctas = 0;
        let fallas = [];
        questions.forEach((q, idx) => {
            const dada = userAnswers[idx];
            if (dada === q.correct) {
                correctas++;
            } else {
                const optDada = q.options.find(o => o.id === dada);
                const optCorrecta = q.options.find(o => o.id === q.correct);
                fallas.push({
                    numero: idx + 1,
                    tema: `Pregunta ${idx + 1}`,
                    enunciado: q.text,
                    seleccionada: optDada ? `${dada}) ${optDada.text}` : (dada || "Sin responder"),
                    correcta: optCorrecta ? `${q.correct}) ${optCorrecta.text}` : q.correct
                });
            }
        });

        const nombreMateria = document.title.replace('Logos Edu |', '').trim();

        let dictamenIA = "";
        if (fallas.length === 0) {
            dictamenIA = `### 1. Diagnóstico Global y Nivel de Desempeño
**Nivel Alcanzado: Superior (100% de Efectividad).**
Precisión absoluta en los ${questions.length} ítems evaluados. El evaluado demuestra un dominio riguroso y sistemático de los estándares conceptuales y metodológicos evaluados en esta prueba.

### 2. Ponderación de Preguntas Críticas
No se registraron fallas operativas, procedimentales ni distracciones en los enunciados evaluados.

### 3. Recomendación Estratégica
Mantener la disciplina de lectura crítica y el ritmo de respuesta en las próximas sesiones simuladas del calendario.`;
        } else {
            const promptUniversal = `Actúa como Coordinador Académico y Docente Experto en Evaluación Saber 11 de Logos Edu.
Genera un Informe de Diagnóstico Pedagógico y Nivelación Analítica exhaustivo, riguroso, muy extenso y de alto nivel técnico para la prueba: "${nombreMateria}".

DATOS DEL DESEMPEÑO:
- Aciertos: ${correctas} de ${questions.length} preguntas.
- Efectividad: ${Math.round((correctas / questions.length) * 100)}%.
- Banco de Fallas Registradas (${fallas.length} preguntas):
${fallas.map(f => `• Ítem ${f.numero} [${f.tema}]:
  - Enunciado clave: "${f.enunciado}"
  - Opción marcada (errónea): "${f.seleccionada}"
  - Opción correcta: "${f.correcta}"`).join('\n\n')}

REGLAS OBLIGATORIAS:
1. NO menciones nombres de estudiantes ni uses juicios personales. Concéntrate exclusivamente en la teoría disciplinar de la materia evaluada, la taxonomía de la prueba y el razonamiento cognitivo.
2. La extensión debe ser muy amplia, profunda y detallada (mínimo 600 palabras), desglosando la teoría con precisión docente.
3. Organiza la respuesta obligatoriamente con las siguientes 5 secciones estructuradas en Markdown:

### 1. Diagnóstico Global y Nivel de Desempeño
- Clasifica el nivel alcanzado (Bajo, Básico, Alto o Superior) según el porcentaje del ${Math.round((correctas / questions.length) * 100)}%.
- Redacta dos párrafos analizando en profundidad la solidez técnica demostrada, las competencias dominadas y el impacto cuantitativo de los errores en el puntaje global estandarizado del examen.

### 2. Ponderación de Preguntas Críticas y Trampas Cognitivas (¿Por qué se fallaron?)
- Agrupa los ítems errados en 2 o 3 núcleos problemáticos recurrentes de esta área.
- Examina con gran detalle la trampa cognitiva o el distractor: explica con precisión por qué la opción marcada resultó engañosa (sesgos de lectura, intuición moral o superficial, confusión de terminología técnica) y contrástala puntualmente con la fundamentación de la opción correcta.

### 3. Fundamentación Teórica y Conceptual de los Vacíos Identificados
- Desarrolla una explicación teórica profunda y rigurosa de cada concepto central involucrado en las fallas.
- Expón los principios disciplinares, definiciones operativas, fórmulas o marcos normativos necesarios para que el evaluado domine el tema a cabalidad.

### 4. Términos y Conceptos Clave a Estudiar Prioritariamente
- Presenta un glosario técnico formal de 4 a 6 conceptos nucleares de esta materia que deben ser repasados de inmediato, cada uno acompañado de su definición formal rigurosa.

### 5. Ruta de Entrenamiento y Descarte Metodológico
- Proporciona pautas operativas concretas de lectura crítica, análisis de condiciones restrictivas y técnicas de descarte sistemático para el próximo simulacro institucional.

Tono: Académico, institucional, pedagógico y riguroso. Emplea subtítulos, negritas y viñetas con claridad.`;

            try {
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptUniversal }] }],
                        generationConfig: {
                            temperature: 0.3,
                            maxOutputTokens: 2500
                        }
                    })
                });

                if (!resp.ok) {
                    throw new Error(`Error API: ${resp.status}`);
                }

                const data = await resp.json();
                dictamenIA = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!dictamenIA) throw new Error("Sin respuesta textual de Gemini");
            } catch (e) {
                console.error("Fallo llamada Gemini, usando respaldo amplio:", e);
                dictamenIA = `### 1. Diagnóstico Global y Nivel de Desempeño
**Nivel de Rendimiento: Básico/Bajo (${Math.round((correctas / questions.length) * 100)}% de Efectividad).**
El resultado obtenido evidencia dificultades sustanciales en la consolidación de competencias nucleares evaluadas en este módulo. Se observa una marcada inconsistencia al enfrentarse a problemáticas que demandan juicio técnico y jerarquización de variables, lo que impacta de manera directa la proyección del puntaje global.

### 2. Ponderación de Preguntas Críticas y Trampas Cognitivas
- **Prevalencia de la Intuición sobre el Rigor Técnico:** Se evidencia una tendencia recurrente a marcar opciones guiadas por juicios de valor o percepciones morales de justicia inmediata, descartando el análisis objetivo del marco conceptual o normativo exigido por el problema.
- **Vulnerabilidad ante Enunciados Condicionales:** Se identifican fallas críticas en ítems formulados con directrices restrictivas o de exclusión, donde se seleccionan opciones afirmativas que omiten la condición específica planteada en la pregunta.

### 3. Fundamentación Teórica y Conceptual de los Vacíos Identificados
- **Diferenciación de Competencias e Instrumentos:** Es prioritario afianzar el alcance exacto de los instrumentos evaluados, distinguiendo procedimientos jurídicos formales de meras declaraciones de intención política o acuerdos de conveniencia.
- **Estructura y Jerarquía Disciplinar:** Los problemas planteados exigen reconocer el principio de contrapesos y la delimitación de funciones; ninguna entidad o actor social puede atribuirse competencias que la estructura institucional no le confiere.

### 4. Términos y Conceptos Clave a Estudiar Prioritariamente
- **Separación de Poderes y Contrapesos:** Principio constitucional que distribuye las ramas del poder público para impedir la concentración autoritaria.
- **Mecanismos de Participación Ciudadana:** Herramientas jurídicas formales (Consulta Popular, Plebiscito, Referendo) con reglas y alcances diferenciados.
- **Ponderación Dimensional:** Capacidad de contrastar variables ambientales, económicas y jurídicas en situaciones de conflicto social.

### 5. Ruta de Entrenamiento y Descarte Metodológico
- **Desarticulación de la Lectura Emocional:** Abstenerse de marcar la opción que "suene deseable" o "correcta en lo cotidiano"; validar siempre cuál opción cuenta con sustento técnico directo.
- **Método de Triangulación y Descarte:** Leer primero la pregunta para identificar el verbo operativo, rastrear las condiciones restrictivas en el contexto y descartar sistemáticamente los distractores que generalizan.`;
            }
        }

        // --- ACTUALIZACIÓN DE GUARDADO CON NOMBRE E INSTITUCIÓN ---
        if (currentUser) {
            try {
                const meta = currentUser.user_metadata || {};
                const institucionUser = meta.institucion || "I.E. Gabriel García Márquez";
                
                const { error } = await sbClient.from('intentos').insert({
                    user_id: currentUser.id,
                    simulacro_id: SIMULACRO_ID,
                    puntaje_global: correctas,
                    respuestas: userAnswers,
                    finalizado: true,
                    fecha_finalizado: new Date().toISOString(),
                    retroalimentacion_ia: dictamenIA,
                    nombre_estudiante: studentName,
                    institucion: institucionUser
                });
                if (error) console.error("Error al insertar en Supabase:", error);
            } catch (err) {
                console.error("Excepción al registrar en Supabase:", err);
            }
        }

        currentStep = 'results';
        render();
    }

    window.onload = async () => {
        await checkStudentSession();
        render();
    };
</script>
</body>
</html>
